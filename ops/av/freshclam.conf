# Shared volume contains signatures only. No reports, application secrets or DB.
DatabaseDirectory /var/lib/clamav
DatabaseOwner clamav
DatabaseMirror database.clamav.net
Checks 12
Foreground yes
LogTime yes
LogVerbose no
# Validate downloaded official signatures. Do not turn this off to save RAM.
TestDatabases yes
Bytecode yes
ConnectTimeout 15
ReceiveTimeout 120
