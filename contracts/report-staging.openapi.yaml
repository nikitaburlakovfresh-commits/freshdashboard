openapi: 3.0.3
info:
  title: FRESH Private Aggregate Report Staging
  version: 0.1.0-staging
  description: >
    Bounded proposed data_source.probe capability on the current personal bootstrap
    administrator NETWORK grant. No role-wide expansion, canonical commit or automatic
    branch mapping. Only own staged packets. No antivirus integration; originals
    remain NOT_SCANNED and downloads are refused. Both files are probed atomically.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /report-batches/capabilities:
    get:
      summary: Current server-checked staging capability and eligible non-demo root UUIDs
      responses:
        '200': {description: Root metadata and bounded limits; commit_available false}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /report-batches:
    get:
      summary: Latest 100 own private batches, no client scope/filter accepted
      responses:
        '200': {description: Items without raw contents, preview or source filenames}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      summary: Reserve durable intent, store private originals, finalize quarantine
      description: >
        Requires same Origin and CSRF before reading multipart. Content-based DB
        deduplication, not an Idempotency-Key header. One receiving upload per app;
        20-second receive deadline, 17 MiB actual request cap. File names do not
        classify reports. No client normalized rows accepted.
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [metadata, files]
              properties:
                metadata:
                  type: string
                  maxLength: 4096
                  description: >
                    JSON object with network_id UUID and period only. period is
                    {state:REQUIRES_CONFIRMATION}, or {state:CONFIRMED,start,end,
                    planStart,planEnd,confirmation}. Dates are YYYY-MM-DD.
                    Sales dates required for CONFIRMED; plan dates both set or both
                    empty. Confirmation text length 10..500. No inferred defaults.
                files:
                  type: array
                  minItems: 1
                  maxItems: 2
                  items: {type: string, format: binary}
                  description: Original XLSX, 1..8388608 bytes each, duplicate file disallowed
      responses:
        '200':
          description: Persisted quarantine packet or reused immutable packet; never canonical import
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Batch'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {description: Invalid multipart/metadata/file count/size/signature or missing real root}
        '503': {description: Busy, unavailable storage or interrupted finalization; refresh list before retry}
  /report-batches/{id}:
    parameters:
      - $ref: '#/components/parameters/BatchId'
    get:
      summary: Own persisted preview and immutable source provenance
      responses:
        '200':
          description: Private batch with files and preview; Cache-Control no-store private
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Batch'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Missing/foreign batch; invalid UUID is also not found}
  /report-batches/{id}/probe:
    parameters:
      - $ref: '#/components/parameters/BatchId'
    post:
      summary: Hash-verify stored originals and persist atomic bounded aggregate preview
      description: >
        Current access rechecked before originals and after worker. A valid
        structure always remains NEEDS_MAPPING, every branch org_unit_id null.
        Any invalid file rejects the entire preview. No partial records.
        Completed packet replay returns same result, no re-evaluation of immutable preview.
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_version]
              properties:
                expected_version: {type: integer, minimum: 1}
      responses:
        '200':
          description: NEEDS_MAPPING or REJECTED with preview_hash and blockers, never committed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Batch'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Missing/foreign batch}
        '409': {description: Version changed before/during probe}
        '422': {description: Invalid command or missing/tampered/incomplete private original}
        '503': {description: Worker busy or temporary database failure; no publication}
  /report-batches/{id}/files/{fileId}/download:
    parameters:
      - $ref: '#/components/parameters/BatchId'
      - name: fileId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      summary: Authenticated fail-closed quarantine gateway
      description: No file bytes released because antivirus is not yet integrated.
      responses:
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {description: No current capability OR known own file still requires antivirus release}
        '404': {description: Own capability valid but batch/file does not exist or is not owned}
components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: __Host-fresh_session}
  parameters:
    BatchId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    Csrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema: {type: string}
  responses:
    Unauthenticated: {description: Personal session required or revoked/expired}
    Forbidden: {description: Current grant-bound staging capability and Origin/CSRF where applicable required}
  schemas:
    Batch:
      type: object
      required: [id, version, status, storage_state, network_id, period, parser_version, mapping_version, canonical_applied, malware_scan, commit_available]
      properties:
        id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        status: {type: string, enum: [QUARANTINE, NEEDS_MAPPING, REJECTED]}
        storage_state: {type: string, enum: [WRITING, READY]}
        network_id: {type: string, format: uuid}
        period: {type: object}
        parser_version: {type: string}
        mapping_version: {type: string, enum: [UNRESOLVED_V1]}
        preview: {type: object, nullable: true, description: Reports, separate source totals, branch rows, controls, unresolved mappings and blockers; omitted from list}
        preview_hash: {type: string, nullable: true, pattern: '^[a-f0-9]{64}$'}
        files: {type: array, items: {type: object}, description: Immutable UUID, display_name, byte_size and SHA-256; omitted from list}
        canonical_applied: {type: boolean, enum: [false]}
        commit_available: {type: boolean, enum: [false]}
        malware_scan: {type: string, enum: [NOT_SCANNED]}
